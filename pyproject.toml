[project]
name = "forzasqueegee"
version = "1.3.0"
description = "FH6 리버리 제작 보조 툴 — 이미지를 인게임 비닐 도형 레이어로 변환하고 오버레이로 안내"
# 상한은 고정한 꾸러미가 받는 범위다 — PySide6 6.11.2가 <3.15이고
# onnxruntime 1.29.0도 3.15 휠이 없다. 넘겨 두면 설치가 뒤엉킨 채 죽는다.
requires-python = ">=3.12,<3.15"
# **판을 못 박는다.** 도형을 놓는 단계가 수치 최적화라 꾸러미 판이 다르면 다른
# 국소 최적에 앉는다 — 같은 그림이 기계마다 다른 도안이 된다. 범위(`>=`)로 두면
# 설치 시점이 그 판을 정해 버리므로 `==`로 고정한다. 올릴 때는 표준 10장을 다시
# 구워 도안이 안 바뀌는지 보고 이 표와 위 상한을 함께 고친다.
dependencies = [
    "numpy==2.5.2",
    "opencv-python==5.0.0.93",
    "Pillow==12.3.0",
    "PySide6==6.11.2",       # shiboken6·Essentials·Addons를 같은 판으로 물고 온다
    "onnxruntime==1.29.0",   # 선화 추출·배경 제거·SR (models/*.onnx, CPU)
]

[project.scripts]
forzasqueegee = "forzasqueegee.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forzasqueegee*"]
